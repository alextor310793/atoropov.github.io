<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не найдена — Торопов А.В.</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;800&family=JetBrains+Mono:wght@400&display=swap">
  <!-- Стили встроены: страница 404 показывается по любому адресу, и относительный путь к css/ там не работает. -->
  <style>
    body{margin:0;font-family:"Golos Text","Segoe UI",Arial,sans-serif;color:#d8dee9;background:#1e2533;
      background-image:linear-gradient(90deg,#182030 64px,#2e384b 64px,#2e384b 65px,transparent 65px);min-height:100vh}
    main{max-width:40rem;margin:0 auto;padding:80px 24px 80px 96px}
    h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1.1;margin:0 0 16px;color:#fff}
    p{color:#8d99b0;font-size:1.15rem;line-height:1.6}
    a{color:#82c8ff}
    .note{font-family:"JetBrains Mono",Consolas,monospace;color:#f5ab66;font-size:1rem;margin:0 0 12px}
    @media (max-width:720px){body{background-image:linear-gradient(90deg,#182030 38px,#2e384b 38px,#2e384b 39px,transparent 39px)}main{padding-left:56px}}
  </style>
</head>
<body>
  <main>
    <p class="note">Error 404: Not Found</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Начните с главной страницы и выберите дисциплину.</p>
    <p><a id="home" href="/">Открыть главную страницу</a></p>
  </main>
  <script>
    // Если сайт лежит в подпапке (логин.github.io/имя-репозитория/), ведём на главную этой подпапки.
    (function () {
      var seg = location.pathname.split("/")[1];
      if (seg === "atoropov.github.io") {
        document.getElementById("home").href = "/" + seg + "/";
      }
    })();
  </script>
</body>
</html>
